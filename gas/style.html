<!--
  ファイル名: style.html
  概要: ダッシュボード画面のスタイル（ライト／ダークモード対応）。index.html から include される。

  更新履歴:
    2026-10-18  新規作成（Python 版の static/style.css として作成）
    2026-10-18  チャットのカードを追加、hidden 属性が効かず登録フォームが常に表示される不具合を修正
    2026-10-18  GAS 版に移行（<style> タグで囲む形に変更、リンク形式のショートカットに対応）
    2026-10-20  タスク名のリンクのスタイルを追加
    2026-10-20  ファイルヘッダに更新履歴を追加
    2026-10-20  新着メール一覧のスタイルを追加、全体のレイアウトを grid-template-areas で再構成
-->
<style>
:root {
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #1f2933;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --warn: #d97706;
  --danger: #dc2626;
  --ok: #059669;
  --radius: 12px;
  font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418;
    --card: #1b1f25;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --line: #2d333b;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --warn: #fbbf24;
    --danger: #f87171;
    --ok: #34d399;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

/*
 * レイアウト（grid-template-areas）
 * 広い画面: 1 段目に時計・今日の予定・カレンダー、2〜3 段目に新着メール（縦長）とタスク・チャット、
 *           4 段目に Redmine とショートカット
 * 中くらい: 2 列。狭い画面（スマホ）: 1 列で、今日やることに関係する順に並べる
 */
.grid {
  display: grid;
  gap: 16px;
  padding: 16px;
  max-width: 1440px;
  margin: 0 auto;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-areas:
    "clock clock clock clock clock clock events events events cal cal cal"
    "mail mail mail mail mail mail mail tasks tasks tasks tasks tasks"
    "mail mail mail mail mail mail mail chat chat chat chat chat"
    "redmine redmine redmine redmine redmine redmine redmine sc sc sc sc sc";
}
.clock-card     { grid-area: clock; }
.events-card    { grid-area: events; }
.cal-card       { grid-area: cal; }
.mail-card      { grid-area: mail; }
.tasks-card     { grid-area: tasks; }
.chat-card      { grid-area: chat; }
.redmine-card   { grid-area: redmine; }
.shortcuts-card { grid-area: sc; }

@media (max-width: 1199px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "clock clock"
      "events cal"
      "mail tasks"
      "mail chat"
      "redmine redmine"
      "sc sc";
  }
}
@media (max-width: 760px) {
  .grid {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "clock" "events" "tasks" "mail" "chat" "cal" "redmine" "sc";
  }
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  min-width: 0;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
h2 { font-size: 15px; margin: 0; font-weight: 600; }

.muted { color: var(--muted); }
.small { font-size: 12px; }
.error { color: var(--danger); }

.btn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font: inherit;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.icon-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--text); }

input, select {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 8px;
  min-width: 0;
}

/* 時計・勤怠 */
.clock-card { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
.clock-date { color: var(--muted); font-size: 15px; }
.clock-time {
  font-size: 64px;
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.clock-time .sec { font-size: 28px; color: var(--muted); }
.att { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
.att-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.att-row label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
.att-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat-label { color: var(--muted); font-size: 12px; }
.stat-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-value.big { font-size: 40px; }
.stat-value.accent { color: var(--accent); }
.stat-value.warn { color: var(--warn); }
.stat-value.danger { color: var(--danger); }
.progress {
  display: flex;
  height: 8px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar { background: var(--accent); width: 0; transition: width .5s; }
.progress-bar.ot { background: var(--warn); }

/* 新着メール */
.mail-card { display: flex; flex-direction: column; }
/* 一覧はカードの高さ（右側のタスク・チャットの高さ）に合わせ、はみ出す分はスクロール */
.list.mail-list { flex: 1 1 0; min-height: 360px; overflow-y: auto; margin: 0 -16px; }
.mail-list li { padding: 0; }
.mail-list a {
  display: block;
  width: 100%;
  padding: 10px 16px;
  color: inherit;
  text-decoration: none;
}
.mail-list a:hover { background: var(--accent-soft); }
.mail-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.mail-from { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-count { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.mail-time { margin-left: auto; color: var(--muted); font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.mail-subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.mail-snippet {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.mail-list li.unread .mail-from,
.mail-list li.unread .mail-subject { font-weight: 700; }
.mail-list li.unread .mail-time { color: var(--accent); font-weight: 600; }
.mail-list li.unread a { box-shadow: inset 3px 0 0 var(--accent); }
.mail-flag { color: var(--warn); flex-shrink: 0; }
.card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.card-foot a { color: var(--accent); text-decoration: none; }
h2 .badge { vertical-align: 2px; margin-left: 4px; }

/* カレンダー */
.cal-nav { display: flex; align-items: center; gap: 4px; }
.month { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: center; }
.month th { color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px 0; }
.month td { padding: 6px 0; border-radius: 6px; font-variant-numeric: tabular-nums; }
.month .dot { display: block; height: 8px; line-height: 8px; font-size: 12px; }
.month td.other { color: var(--muted); opacity: .4; }
.month .sun { color: var(--danger); }
.month .sat { color: var(--accent); }
.month td.today { background: var(--accent); color: #fff; font-weight: 600; }

/* リスト */
.list { list-style: none; padding: 0; margin: 0; }
.list li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.list li:last-child { border-bottom: none; }
.list .grow { flex: 1; min-width: 0; }
.list .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .time { font-variant-numeric: tabular-nums; color: var(--muted); width: 96px; flex-shrink: 0; }
.list li.now .time { color: var(--accent); font-weight: 600; }
.list li.past { opacity: .5; }
.list li.done .title { text-decoration: line-through; color: var(--muted); }
.list .del { visibility: hidden; }
.list li:hover .del { visibility: visible; }
.empty { color: var(--muted); padding: 8px 0; }

.badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
  flex-shrink: 0;
}
.badge.overdue { background: var(--danger); color: #fff; }
.badge.today   { background: var(--warn); color: #fff; }
.issue a, .chat-list a, #tasks a { color: inherit; text-decoration: none; }
.issue a:hover, .chat-list a:hover, #tasks a:hover { text-decoration: underline; }
.chat-list li { padding: 4px 0; font-size: 13px; }

.inline-form { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.inline-form input:first-of-type { flex: 1; }

/* ショートカット */
.shortcuts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px;
}
.sc {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  cursor: pointer;
  color: var(--text);
  font: inherit;
  text-align: center;
}
.sc:hover { border-color: var(--accent); }
a.sc { text-decoration: none; }
.sc-icon { font-size: 26px; line-height: 1; }
.sc-name { font-size: 12px; word-break: break-all; }
.sc-del {
  position: absolute;
  top: 2px; right: 2px;
  border: none;
  background: var(--danger);
  color: #fff;
  border-radius: 50%;
  width: 20px; height: 20px;
  font-size: 12px;
  cursor: pointer;
  display: none;
}
.editing .sc-del { display: block; }
.editing .sc { cursor: grab; }
.sc-form { margin-top: 12px; }
.sc-form #sc-target { flex: 2; min-width: 200px; }

.toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--card);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
}
</style>
