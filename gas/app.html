<!--
  ファイル名: app.html
  概要: ダッシュボード画面の処理（時計・勤怠・メール・チャット・カレンダー・予定・タスク・
        Redmine・ショートカットの表示と操作）。index.html から include される。

  更新履歴:
    2026-10-18  新規作成（Python 版の static/app.js として作成）
    2026-10-18  チャットの未読表示を追加
    2026-10-18  GAS 版に移行（google.script.run 経由の呼び出しに変更、ショートカットを URL と
                フォルダのパスのコピーに変更）
    2026-10-20  Google ToDo リストのタスク表示に対応（期限なし、リンク、エラー表示、定期更新）
    2026-10-20  ファイルヘッダに更新履歴を追加
    2026-10-20  メールを新着メールの一覧（差出人・件名・本文の冒頭・未読表示）に変更
-->
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
// 36協定の原則的な上限（月45時間）を目安に色分けする
const MONTH_OT_WARN = 30 * 60;
const MONTH_OT_LIMIT = 45 * 60;

function todayISO(d = new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtMinutes(m) {
  return `${Math.floor(m / 60)}:${pad(m % 60)}`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// google.script.run（Code.gs の関数呼び出し）を Promise で包む
function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((e) => reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}

// iframe 内では Clipboard API が使えない場合があるため execCommand にフォールバック
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return;
  } catch (_) { /* fallback */ }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  if (!ok) throw new Error("コピーできませんでした");
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.hidden = true), 3000);
}

/* ------------------------------------------------------------ 時計 */

let lastDay = todayISO();
function tickClock() {
  const d = new Date();
  $("clock-date").textContent =
    `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
  $("clock-time").innerHTML =
    `${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">:${pad(d.getSeconds())}</span>`;
  // 日付が変わったら全体を再読み込み
  if (todayISO(d) !== lastDay) {
    lastDay = todayISO(d);
    calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    loadAll();
  }
}

/* ------------------------------------------------------------ 勤怠 */

let att = null;
async function loadAttendance() {
  att = await api("getAttendance");
  renderAttendance();
}

function renderAttendance() {
  if (!att) return;
  const active = document.activeElement;
  if (active !== $("att-in")) $("att-in").value = att.clock_in || "";
  if (active !== $("att-out")) $("att-out").value = att.clock_out || "";

  const btn = $("btn-clock");
  if (!att.clock_in) btn.textContent = "出勤する";
  else if (!att.clock_out) btn.textContent = "退勤する";
  else btn.textContent = "退勤を取り消す";

  $("att-worked").textContent = fmtMinutes(att.worked_minutes);
  const ot = $("att-ot");
  ot.textContent = fmtMinutes(att.overtime_minutes);
  ot.className = "stat-value" + (att.overtime_minutes > 0 ? " warn" : "");

  const mo = $("att-month");
  mo.textContent = fmtMinutes(att.month_overtime_minutes);
  mo.className = "stat-value" +
    (att.month_overtime_minutes >= MONTH_OT_LIMIT ? " danger"
      : att.month_overtime_minutes >= MONTH_OT_WARN ? " warn" : "");

  const std = att.standard_minutes || 1;
  const base = Math.min(att.worked_minutes, std);
  const total = Math.max(att.worked_minutes, std);
  $("att-bar").style.width = `${(base / total) * 100}%`;
  $("att-bar-ot").style.width = `${(att.overtime_minutes / total) * 100}%`;

  const notes = [`所定 ${fmtMinutes(att.standard_minutes)}（休憩 ${att.break_minutes}分）`];
  if (att.planned_out) {
    const remain = att.standard_minutes - att.worked_minutes;
    notes.push(`定時退勤の目安 ${att.planned_out}`);
    if (!att.clock_out && remain > 0) notes.push(`あと ${fmtMinutes(remain)}`);
  }
  notes.push(`今月の出勤 ${att.month_work_days}日`);
  $("att-note").textContent = notes.join(" ・ ");
}

$("btn-clock").addEventListener("click", async () => {
  if (!att.clock_in) att = await api("updateAttendance", "clock_in");
  else if (!att.clock_out) att = await api("updateAttendance", "clock_out");
  else att = await api("updateAttendance", "edit", { out: "" });
  renderAttendance();
});

for (const [id, key] of [["att-in", "in"], ["att-out", "out"]]) {
  $(id).addEventListener("change", async (e) => {
    try {
      att = await api("updateAttendance", "edit", { [key]: e.target.value });
      renderAttendance();
    } catch (err) {
      toast(err.message);
    }
  });
}

/* ------------------------------------------------------------ メール */

async function loadMail(refresh = false) {
  const r = await api("getMail", refresh);
  if (!r.ok) {
    $("mail-list").innerHTML = "";
    $("mail-unread").hidden = true;
    $("mail-meta").innerHTML = `<span class="error">${esc(r.error)}</span>`;
    return;
  }
  const unread = r.items.filter((m) => m.unread).length;
  $("mail-unread").hidden = !unread;
  $("mail-unread").textContent = `未読 ${unread}`;
  $("mail-list").innerHTML = r.items.map((m) => `
    <li class="${m.unread ? "unread" : ""}">
      <a href="${esc(m.url)}" target="_blank" rel="noopener" title="${esc(m.from_address)}\n${esc(m.datetime)}">
        <div class="mail-row">
          <span class="mail-from">${esc(m.from)}</span>
          ${m.count > 1 ? `<span class="mail-count">${m.count}</span>` : ""}
          ${m.starred ? `<span class="mail-flag" title="スター付き">★</span>` : ""}
          <span class="mail-time">${esc(m.time)}</span>
        </div>
        <div class="mail-subject">${esc(m.subject)}</div>
        ${m.snippet ? `<div class="mail-snippet">${esc(m.snippet)}</div>` : ""}
      </a>
    </li>`).join("") || `<li class="empty" style="padding: 8px 16px">新着メールはありません</li>`;
  $("mail-meta").textContent = `${r.fetched_at} 更新`;
}

/* ------------------------------------------------------------ チャット */

async function loadChat(refresh = false) {
  const r = await api("getChat", refresh);
  if (r.disabled) {
    $("chat-total").textContent = "-";
    $("chat-spaces").innerHTML = "";
    $("chat-meta").textContent = "チャット連携は無効です（Config.gs）";
    return;
  }
  if (!r.ok) {
    $("chat-total").textContent = "-";
    $("chat-spaces").innerHTML = "";
    $("chat-meta").innerHTML = `<span class="error">${esc(r.error)}</span>`;
    return;
  }
  $("chat-total").textContent = r.total + (r.over ? "+" : "");
  $("chat-spaces").innerHTML = r.spaces.slice(0, 5).map((s) => {
    const name = s.url
      ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`
      : esc(s.name);
    return `<li><span class="grow title">${name}</span>
      <span class="badge">${s.unread}${s.over ? "+" : ""}</span></li>`;
  }).join("") + (r.spaces.length > 5 ? `<li class="muted small">ほか ${r.spaces.length - 5} 件</li>` : "");
  $("chat-meta").textContent = `${r.demo ? "デモデータ ・ " : ""}${r.fetched_at} 更新`;
}

/* ------------------------------------------------------------ カレンダー */

let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let tasks = [];

function renderCalendar() {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  $("cal-title").textContent = `${y}年${m + 1}月`;
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - first.getDay());
  const today = todayISO();
  const dueDays = new Set(tasks.filter((t) => !t.done && t.due).map((t) => t.due));

  let html = "<tr>" + WEEK.map((w, i) =>
    `<th class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</th>`).join("") + "</tr>";
  for (let w = 0; w < 6; w++) {
    html += "<tr>";
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + i);
      const iso = todayISO(d);
      const cls = [
        d.getMonth() !== m ? "other" : "",
        i === 0 ? "sun" : i === 6 ? "sat" : "",
        iso === today ? "today" : "",
      ].join(" ");
      const dot = `<span class="dot">${dueDays.has(iso) ? "•" : ""}</span>`;
      html += `<td class="${cls}" title="${dueDays.has(iso) ? "タスクあり" : ""}">${d.getDate()}${dot}</td>`;
    }
    html += "</tr>";
  }
  $("cal-grid").innerHTML = html;
}

$("cal-prev").addEventListener("click", () => {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
  renderCalendar();
});
$("cal-next").addEventListener("click", () => {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
  renderCalendar();
});

/* ------------------------------------------------------------ 今日の予定 */

let events = [];
async function loadEvents(refresh = false) {
  const r = await api("getEvents", refresh);
  if (!r.ok) {
    $("events").innerHTML = "";
    $("events-meta").innerHTML = `<span class="error">${esc(r.error)}</span>`;
    return;
  }
  events = r.events;
  $("events-meta").textContent = `${r.demo ? "デモデータ ・ " : ""}${r.fetched_at} 更新`;
  renderEvents();
}

function renderEvents() {
  if (!events.length) {
    $("events").innerHTML = `<li class="empty">今日の予定はありません</li>`;
    return;
  }
  const now = new Date();
  $("events").innerHTML = events.map((e) => {
    let cls = "";
    let time = "終日";
    if (!e.all_day) {
      const s = new Date(e.start);
      const en = e.end ? new Date(e.end) : s;
      time = `${e.start.slice(11, 16)}–${e.end ? e.end.slice(11, 16) : ""}`;
      if (en < now) cls = "past";
      else if (s <= now) cls = "now";
    }
    return `<li class="${cls}">
      <span class="time">${time}</span>
      <span class="grow"><div class="title">${esc(e.title)}</div>
      ${e.location ? `<div class="muted small title">${esc(e.location)}</div>` : ""}</span>
    </li>`;
  }).join("");
}

/* ------------------------------------------------------------ タスク */

async function loadTasks() {
  try {
    tasks = await api("getTasks");
    $("tasks-meta").textContent = "";
  } catch (err) {
    $("tasks-meta").innerHTML = `<span class="error">${esc(err.message)}</span>`;
  }
  renderTasks();
  renderCalendar();
}

function renderTasks() {
  const today = todayISO();
  // 未完了で期限が今日以前（期限なしを含む）のもの + 今日完了したもの
  const shown = tasks
    .filter((t) => (!t.done && (!t.due || t.due <= today)) || (t.done && t.done_on === today))
    .sort((a, b) => a.done - b.done || !a.due - !b.due || (a.due || "").localeCompare(b.due || ""));
  const upcoming = tasks.filter((t) => !t.done && t.due && t.due > today).length;

  let html = shown.map((t) => {
    const badge = !t.done && t.due && t.due < today
      ? `<span class="badge overdue">期限切れ ${t.due.slice(5)}</span>`
      : !t.done && !t.due ? `<span class="badge">期限なし</span>` : "";
    const title = t.url
      ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>`
      : esc(t.title);
    return `<li class="${t.done ? "done" : ""}" data-id="${esc(t.id)}" title="${esc(t.list || "")}">
      <input type="checkbox" ${t.done ? "checked" : ""}>
      <span class="grow title">${title}</span>${badge}
      ${t.deletable ? `<button class="icon-btn del" title="削除">✕</button>` : ""}
    </li>`;
  }).join("");
  if (!shown.length) html = `<li class="empty">今日のタスクはありません</li>`;
  if (upcoming) html += `<li class="muted small">明日以降のタスク ${upcoming}件</li>`;
  $("tasks").innerHTML = html;
}

$("task-due").value = todayISO();
$("task-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    tasks = await api("addTask", $("task-title").value, $("task-due").value);
    $("task-title").value = "";
  } catch (err) {
    toast(err.message);
  }
  renderTasks();
  renderCalendar();
});

$("tasks").addEventListener("click", async (e) => {
  const li = e.target.closest("li[data-id]");
  if (!li) return;
  const id = li.dataset.id;
  try {
    if (e.target.matches("input[type=checkbox]")) {
      e.target.disabled = true;
      tasks = await api("updateTask", id, e.target.checked);
    } else if (e.target.matches(".del")) {
      tasks = await api("deleteTask", id);
    } else return;
  } catch (err) {
    toast(err.message);
  }
  renderTasks();
  renderCalendar();
});

/* ------------------------------------------------------------ Redmine */

async function loadRedmine(refresh = false) {
  const r = await api("getRedmine", refresh);
  if (r.disabled) {
    $("issues").innerHTML = `<li class="empty">Redmine 連携は無効です（Config.gs）</li>`;
    $("issues-meta").textContent = "";
    return;
  }
  if (!r.ok) {
    $("issues").innerHTML = "";
    $("issues-meta").innerHTML = `<span class="error">${esc(r.error)}</span>`;
    return;
  }
  const today = todayISO();
  const ms = 24 * 60 * 60 * 1000;
  $("issues").innerHTML = r.issues.length ? r.issues.map((i) => {
    const diff = Math.round((new Date(i.due_date) - new Date(today)) / ms);
    const [cls, label] = diff < 0 ? ["overdue", `${-diff}日超過`]
      : diff === 0 ? ["today", "今日まで"] : ["", `あと${diff}日`];
    const link = r.base_url
      ? `<a href="${esc(r.base_url)}/issues/${i.id}" target="_blank" rel="noopener">#${i.id} ${esc(i.subject)}</a>`
      : `#${i.id} ${esc(i.subject)}`;
    return `<li class="issue">
      <span class="badge ${cls}">${label}</span>
      <span class="grow"><div class="title">${link}</div>
        <div class="muted small title">${esc(i.project)} ・ ${esc(i.status)} ・ 優先度 ${esc(i.priority)} ・ 期日 ${i.due_date} ・ ${i.done_ratio}%</div>
      </span>
    </li>`;
  }).join("") : `<li class="empty">期限が近いチケットはありません</li>`;
  $("issues-meta").textContent = `${r.demo ? "デモデータ ・ " : ""}${r.fetched_at} 更新`;
}

/* ------------------------------------------------------------ ショートカット */

const SC_ICON = { folder: "📁", url: "🌐" };
let shortcuts = [];
let editing = false;

async function loadShortcuts() {
  shortcuts = await api("getShortcuts");
  renderShortcuts();
}

// URL は <a> で開く（GAS の画面は iframe 内のため、リンクで新しいタブを開く）
// フォルダはブラウザから開けないため、クリックでパスをコピーする
function renderShortcuts() {
  const box = $("shortcuts");
  box.classList.toggle("editing", editing);
  box.innerHTML = shortcuts.map((s) => {
    const inner = `
      <span class="sc-icon">${SC_ICON[s.type] || "📄"}</span>
      <span class="sc-name">${esc(s.name)}</span>
      <span class="sc-del" title="削除">✕</span>`;
    return s.type === "url"
      ? `<a class="sc" data-id="${s.id}" href="${esc(s.target)}" target="_blank" rel="noopener" title="${esc(s.target)}" draggable="${editing}">${inner}</a>`
      : `<button class="sc" data-id="${s.id}" title="クリックでパスをコピー: ${esc(s.target)}" draggable="${editing}">${inner}</button>`;
  }).join("") || `<div class="empty">✎ からショートカットを登録できます</div>`;
}

$("shortcuts").addEventListener("click", async (e) => {
  const el = e.target.closest(".sc");
  if (!el) return;
  const item = shortcuts.find((s) => s.id === el.dataset.id);
  if (editing) {
    e.preventDefault();
    if (e.target.matches(".sc-del")) {
      shortcuts = await api("deleteShortcut", item.id);
      renderShortcuts();
    }
    return;
  }
  if (item.type === "folder") {
    try {
      await copyText(item.target);
      toast("パスをコピーしました。エクスプローラーのアドレス欄に貼り付けてください");
    } catch (err) {
      toast(err.message);
    }
  }
});

// 編集モード中はドラッグで並べ替え
let dragId = null;
$("shortcuts").addEventListener("dragstart", (e) => {
  dragId = e.target.closest(".sc")?.dataset.id;
});
$("shortcuts").addEventListener("dragover", (e) => e.preventDefault());
$("shortcuts").addEventListener("drop", async (e) => {
  e.preventDefault();
  const over = e.target.closest(".sc")?.dataset.id;
  if (!dragId || !over || dragId === over) return;
  const ids = shortcuts.map((s) => s.id).filter((i) => i !== dragId);
  ids.splice(ids.indexOf(over), 0, dragId);
  shortcuts = await api("reorderShortcuts", ids);
  renderShortcuts();
});

$("sc-edit").addEventListener("click", () => {
  editing = !editing;
  $("sc-form").hidden = !editing;
  renderShortcuts();
});

$("sc-type").addEventListener("change", (e) => {
  $("sc-target").placeholder = {
    url: "URL（例: https://drive.google.com/）",
    folder: "フォルダのパス（例: C:\\Users\\me\\Documents、\\\\server\\share）",
  }[e.target.value];
});

$("sc-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    shortcuts = await api("addShortcut", {
      type: $("sc-type").value,
      name: $("sc-name").value,
      target: $("sc-target").value,
    });
    $("sc-name").value = $("sc-target").value = "";
    renderShortcuts();
  } catch (err) {
    toast(err.message);
  }
});

/* ------------------------------------------------------------ 起動 */

document.querySelectorAll("[data-refresh]").forEach((b) => b.addEventListener("click", () => {
  ({ mail: loadMail, chat: loadChat, calendar: loadEvents, tasks: loadTasks, redmine: loadRedmine })[b.dataset.refresh](true);
}));

function safe(fn) {
  return (...a) => fn(...a).catch((e) => console.error(e));
}

function loadAll() {
  safe(loadAttendance)();
  safe(loadMail)();
  safe(loadChat)();
  safe(loadEvents)();
  safe(loadTasks)();
  safe(loadRedmine)();
  safe(loadShortcuts)();
}

tickClock();
setInterval(tickClock, 1000);
loadAll();
setInterval(safe(loadAttendance), 60 * 1000);
setInterval(renderEvents, 60 * 1000);
// サーバー側（CacheService）でキャッシュしているため、外部へのアクセスは各キャッシュ時間に 1 回程度
setInterval(safe(loadMail), 2 * 60 * 1000);
setInterval(safe(loadChat), 2 * 60 * 1000);
setInterval(safe(loadEvents), 5 * 60 * 1000);
setInterval(safe(loadRedmine), 5 * 60 * 1000);
setInterval(safe(loadTasks), 5 * 60 * 1000);
</script>
